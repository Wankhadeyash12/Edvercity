<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Glass Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #2563eb,
    #9333ea);
}

/* Floating Glow Balls */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
}

.glow1{
    width:300px;
    height:300px;
    background:#06b6d4;
    top:-100px;
    left:-100px;
}

.glow2{
    width:350px;
    height:350px;
    background:#8b5cf6;
    bottom:-100px;
    right:-100px;
}

.glow3{
    width:250px;
    height:250px;
    background:#ec4899;
    top:50%;
    left:50%;
}

/* Login Card */

.card{

    width:420px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.2);

    border-radius:30px;

    padding:40px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.3);

    color:white;

    z-index:10;
}

/* Heading */

.card h1{
    text-align:center;
    margin-bottom:10px;
    font-size:2.5rem;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:35px;
}

/* Inputs */

.input-group{
    margin-bottom:20px;
}

.input-group input{

    width:100%;

    padding:16px 20px;

    border:none;

    outline:none;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:16px;

    transition:.3s;
}

.input-group input:focus{

    background:rgba(255,255,255,.15);

    box-shadow:
    0 0 15px rgba(255,255,255,.2);

}

.input-group input::placeholder{
    color:#d1d5db;
}

/* Button */

.btn{

    width:100%;

    padding:16px;

    border:none;

    border-radius:15px;

    background:
    linear-gradient(
    45deg,
    #06b6d4,
    #8b5cf6);

    color:white;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

    transition:.4s;
}

.btn:hover{

    transform:translateY(-4px);

    box-shadow:
    0 15px 30px rgba(139,92,246,.5);

}

/* Footer */

.links{

    display:flex;
    justify-content:space-between;

    margin-top:20px;

    font-size:14px;
}

.links a{
    color:white;
    text-decoration:none;
}

@media(max-width:500px){

.card{
    width:90%;
    padding:30px;
}

.card h1{
    font-size:2rem;
}

}

</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div class="card">

<h1>Welcome Back</h1>

<p class="subtitle">
Sign in to continue
</p>

<div class="input-group">
<input type="email" placeholder="Email Address">
</div>

<div class="input-group">
<input type="password" placeholder="Password">
</div>

<button class="btn">
Login
</button>

<div class="links">

<a href="#">Forgot Password?</a>

<a href="#">Create Account</a>

</div>

</div>

</body>
</html>
