<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Loading Spinner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:linear-gradient(
    135deg,
    #0f172a,
    #1e3a8a,
    #7c3aed);
}

/* Spinner */

.spinner{
    width:100px;
    height:100px;

    border:8px solid rgba(255,255,255,.2);
    border-top:8px solid #00e5ff;

    border-radius:50%;

    animation:spin 1s linear infinite;

    box-shadow:
    0 0 20px rgba(0,229,255,.5);
}

/* Loading Text */

.loading-text{
    margin-top:25px;
    color:white;
    font-size:22px;
    font-weight:600;
    letter-spacing:2px;

    animation:blink 1.5s infinite;
}

/* Spinner Animation */

@keyframes spin{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }

}

/* Text Animation */

@keyframes blink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }

}

</style>
</head>
<body>

<div class="spinner"></div>

<div class="loading-text">
    Loading...
</div>

</body>
</html>
