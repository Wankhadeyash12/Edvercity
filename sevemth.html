<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Timetable</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
        }

        h1{
            text-align: center;
            color: #2c3e50;
        }

        table{
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        th, td{
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: #3498db;
            color: white;
        }

        tr:nth-child(even){
            background-color: #f2f2f2;
        }

        .break{
            background-color: #f39c12;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📚 College Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>12:00 - 1:00</th>
            <th>1:00 - 2:00</th>
            <th>2:00 - 3:00</th>
        </tr>

        <tr>
            <td><b>Monday</b></td>
            <td>Java</td>
            <td>DBMS</td>
            <td>Maths</td>
            <td rowspan="5" class="break">LUNCH BREAK</td>
            <td>Web Dev</td>
            <td>OS</td>
        </tr>

        <tr>
            <td><b>Tuesday</b></td>
            <td>CN</td>
            <td>Java</td>
            <td>DBMS</td>
            <td>Maths</td>
            <td>Lab</td>
        </tr>

        <tr>
            <td><b>Wednesday</b></td>
            <td>OS</td>
            <td>Web Dev</td>
            <td>Java</td>
            <td>DBMS</td>
            <td>CN</td>
        </tr>

        <tr>
            <td><b>Thursday</b></td>
            <td>Maths</td>
            <td>OS</td>
            <td>CN</td>
            <td>Java</td>
            <td>Lab</td>
        </tr>

        <tr>
            <td><b>Friday</b></td>
            <td>DBMS</td>
            <td>Maths</td>
            <td>Web Dev</td>
            <td>OS</td>
            <td>Project</td>
        </tr>
    </table>

</body>
</html>
