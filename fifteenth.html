<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card{
        width: 300px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        overflow: hidden;
        text-align: center;
    }

    .card img{
        width: 100%;
        height: 200px;
    }

    .card h2{
        margin: 15px 0;
        color: #333;
    }

    .card p{
        color: #666;
        padding: 0 15px;
    }

    .price{
        color: #28a745;
        font-size: 22px;
        font-weight: bold;
        margin: 10px 0;
    }

    .btn{
        display: inline-block;
        background: #007bff;
        color: white;
        padding: 10px 20px;
        margin: 15px;
        text-decoration: none;
        border-radius: 5px;
    }

    .btn:hover{
        background: #0056b3;
    }
</style>

</head>
<body>

<div class="card">
    
    <img src="https://m.media-amazon.com/images/I/81O1uCPS8lL._SL1500_.jpg" alt="Laptop">

    <h2>Gaming Laptop</h2>

    <p>
       Lenovo Legion 5 2025 AMD Ryzen 7 260 | NVIDIA RTX 5050 8GB (16GB RAM/1TB SSD/WUXGA IPS/165Hz/15(39.6cm)/Windows 11/Office 2024+AI Now/Black/2.5Kg), 83M00073IN AI Powered Gaming Laptop
    </p>

    <div class="price">1,49,990.</div>

    <a href="#" class="btn">Buy Now</a>

</div>

</body>
</html>
