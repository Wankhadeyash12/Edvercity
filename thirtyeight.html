<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
    135deg,
    #0f172a,
    #3b82f6,
    #8b5cf6);

    overflow:hidden;
}

/* Background Circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
}

.circle1{
    width:250px;
    height:250px;
    top:-80px;
    left:-80px;
}

.circle2{
    width:180px;
    height:180px;
    bottom:-60px;
    right:-60px;
}

/* Card */

.card{
    width:370px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    text-align:center;

    padding:35px;

    color:white;

    box-shadow:0 15px 35px rgba(0,0,0,.3);

    transition:.5s;
}

.card:hover{
    transform:translateY(-15px) scale(1.03);

    box-shadow:0 25px 50px rgba(0,0,0,.4);
}

/* Profile Image */

.profile-img{
    width:140px;
    height:140px;

    border-radius:50%;

    object-fit:cover;

    border:5px solid rgba(255,255,255,.3);

    transition:.5s;
}

.card:hover .profile-img{
    transform:scale(1.1) rotate(5deg);
}

/* Text */

h2{
    margin-top:20px;
    font-size:28px;
}

.role{
    color:#dbeafe;
    margin:10px 0 20px;
}

.bio{
    font-size:15px;
    line-height:1.7;
    opacity:.9;
}

/* Social Icons */

.social{
    margin:25px 0;
}

.social a{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    width:45px;
    height:45px;

    margin:0 6px;

    border-radius:50%;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,.15);

    transition:.4s;
}

.social a:hover{
    transform:translateY(-8px);

    background:white;

    color:#3b82f6;
}

/* Button */

.btn{
    display:inline-block;

    padding:14px 35px;

    text-decoration:none;

    color:white;

    border-radius:50px;

    background:linear-gradient(
    45deg,
    #06b6d4,
    #8b5cf6);

    transition:.4s;
}

.btn:hover{
    transform:scale(1.05);

    box-shadow:0 10px 30px rgba(139,92,246,.5);
}

/* Mobile */

@media(max-width:450px){

    .card{
        width:90%;
        padding:25px;
    }

    h2{
        font-size:24px;
    }

}

</style>
</head>
<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>

<div class="card">

    <img
    src="yash.jpeg"
    class="profile-img"
    alt="Profile">

    <h2>Yash Wankhade</h2>

    <p class="role">
        Full Stack Developer
    </p>

    <p class="bio">
        Passionate MERN Stack Developer
        creating responsive websites,
        modern web applications, and
        innovative digital experiences.
    </p>

    <div class="social">

        <a href="https://github.com/Wankhadeyash12/">
            <i class="fab fa-github"></i>
        </a>

        <a href="https://www.linkedin.com/in/yash-wankhade-11b406384/">
            <i class="fab fa-linkedin-in"></i>
        </a>

        <a href="#">
            <i class="fab fa-instagram"></i>
        </a>

        <a href="#">
            <i class="fab fa-twitter"></i>
        </a>

    </div>

    <a href="#" class="btn">
        View Profile
    </a>

</div>

</body>
</html>
