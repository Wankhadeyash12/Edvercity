<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favorite Movies</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#7c3aed);
    padding:20px;
}

.container{
    width:90%;
    max-width:800px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    margin-bottom:15px;
    font-size:2.8rem;
}

.subtitle{
    text-align:center;
    margin-bottom:30px;
    color:#d1d5db;
}

ol{
    padding-left:30px;
}

li{
    background:rgba(255,255,255,0.12);
    margin:15px 0;
    padding:15px 20px;
    border-radius:15px;
    font-size:18px;
    transition:0.3s;
}

li:hover{
    transform:translateX(10px);
    background:rgba(255,255,255,0.2);
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#cbd5e1;
}
</style>
</head>
<body>

<div class="container">

    <h1>🎬 My Favorite Movies</h1>

    <p class="subtitle">
        A collection of my favorite South Indian Action and Romantic Movies
    </p>

    <ol>
        <li>🔥 Dear comrade</li>
         <li>💖 Geetha Govindam</li>
        <li>Dragon</li>
        <li>❤️ Sita Ramam</li>
        <li>Drishyam</li>
        <li>🚀 RRR</li>
        <li>🎯 Pushpa</li>
        <li>🏹 Bahubali 2</li>
        <li>Dhurandhar</li>
        <li>Vijay the master</li>
    </ol>

    <div class="footer">
        Made with ❤️ by Yash Wankhade
    </div>

</div>

</body>
</html>
