<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beautiful Image Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.container{
    width:90%;
    max-width:1200px;
    text-align:center;
}

h1{
    color:white;
    margin-bottom:30px;
    font-size:3rem;
    text-shadow:0 0 15px #38bdf8;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.image-card{
    overflow:hidden;
    border-radius:20px;
    background:white;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    transition:0.4s;
}

.image-card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 35px rgba(56,189,248,0.5);
}

.image-card img{
    width:100%;
    height:280px;
    object-fit:cover;
    transition:0.5s;
}

.image-card:hover img{
    transform:scale(1.1);
}

.caption{
    padding:15px;
    font-size:18px;
    font-weight:600;
    color:#1e293b;
}

</style>
</head>
<body>

<div class="container">

    <h1>📸 My Image Gallery</h1>

    <div class="gallery">

        <div class="image-card">
            <img src="clg.webp" alt="College">
            <div class="caption"> College </div>
        </div>

        <div class="image-card">
            <img src="yash.jpeg" alt="Yash Wankhade">
            <div class="caption"> Yash Wankhade </div>
        </div>

        <div class="image-card">
            <img src="Team.jpeg" alt="Team">
            <div class="caption"> Team </div>
        </div>

 <div class="image-card">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800" alt="Nature">
            <div class="caption">🌿 Nature</div>
        </div>

    </div>

</div>

</body>
</html>
