<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Balls Animation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:linear-gradient(
    135deg,
    #0f172a,
    #1e3a8a,
    #7c3aed);

    overflow:hidden;
}

/* Heading */

h1{
    color:white;
    margin-bottom:50px;
    font-size:3rem;
    text-shadow:0 0 20px rgba(255,255,255,.3);
}

/* Container */

.loader{
    display:flex;
    gap:20px;
}

/* Balls */

.ball{
    width:40px;
    height:40px;
    border-radius:50%;

    animation:bounce 0.8s infinite alternate;
}

/* Different Colors */

.ball:nth-child(1){
    background:#00e5ff;
    animation-delay:0s;
    box-shadow:0 0 25px #00e5ff;
}

.ball:nth-child(2){
    background:#ff4d6d;
    animation-delay:0.2s;
    box-shadow:0 0 25px #ff4d6d;
}

.ball:nth-child(3){
    background:#ffd60a;
    animation-delay:0.4s;
    box-shadow:0 0 25px #ffd60a;
}

.ball:nth-child(4){
    background:#38b000;
    animation-delay:0.6s;
    box-shadow:0 0 25px #38b000;
}

/* Animation */

@keyframes bounce{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-120px);
    }

}

/* Text */

.loading{
    color:white;
    margin-top:40px;
    font-size:24px;
    letter-spacing:3px;

    animation:blink 1.5s infinite;
}

@keyframes blink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }

}

@media(max-width:768px){

    h1{
        font-size:2rem;
    }

    .ball{
        width:30px;
        height:30px;
    }

}

</style>
</head>
<body>

<h1>CSS Bouncing Balls</h1>

<div class="loader">

    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>

</div>

<div class="loading">
    LOADING...
</div>

</body>
</html>
