<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Music Player</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
    135deg,
    #0f172a,
    #2563eb,
    #9333ea);
}

/* Player Card */

.player{

    width:400px;

    padding:30px;

    border-radius:30px;

    background:rgba(255,255,255,.1);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    text-align:center;

    color:white;

    box-shadow:0 20px 40px rgba(0,0,0,.3);
}

/* Cover */

.cover{

    width:250px;
    height:250px;

    margin:auto;

    border-radius:20px;

    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h2{
    margin-top:20px;
}

.artist{
    color:#ddd;
    margin-bottom:20px;
}

/* Upload Button */

.upload-btn{

    display:inline-block;

    padding:12px 25px;

    border-radius:30px;

    background:linear-gradient(
    45deg,
    #06b6d4,
    #8b5cf6);

    cursor:pointer;

    margin-bottom:20px;
}

.upload-btn:hover{
    opacity:.9;
}

input[type=file]{
    display:none;
}

/* Progress */

.progress-container{

    width:100%;
    height:8px;

    background:rgba(255,255,255,.2);

    border-radius:20px;

    cursor:pointer;

    margin-top:20px;
}

.progress{
    width:0%;
    height:100%;

    background:#00e5ff;

    border-radius:20px;
}

/* Time */

.time{
    display:flex;
    justify-content:space-between;

    margin-top:10px;

    font-size:14px;
}

/* Controls */

.controls{

    display:flex;

    justify-content:center;

    margin-top:25px;
}

.play-btn{

    width:70px;
    height:70px;

    border:none;

    border-radius:50%;

    background:linear-gradient(
    45deg,
    #06b6d4,
    #8b5cf6);

    color:white;

    font-size:25px;

    cursor:pointer;
}

.play-btn:hover{
    transform:scale(1.08);
}

</style>
</head>
<body>

<div class="player">

    <div class="cover">
        <img
        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800"
        alt="">
    </div>

    <h2 id="songTitle">
        No Song Selected
    </h2>

    <p class="artist">
        Choose an MP3 file
    </p>

    <label
    for="audioFile"
    class="upload-btn">

        🎵 Select Song

    </label>

    <input
    type="file"
    id="audioFile"
    accept="audio/*">

    <audio id="audio"></audio>

    <div class="progress-container"
         id="progressContainer">

        <div class="progress"
             id="progress"></div>

    </div>

    <div class="time">

        <span id="currentTime">
            0:00
        </span>

        <span id="duration">
            0:00
        </span>

    </div>

    <div class="controls">

        <button
        class="play-btn"
        id="playBtn">

            <i class="fas fa-play"></i>

        </button>

    </div>

</div>

<script>

const audio =
document.getElementById("audio");

const fileInput =
document.getElementById("audioFile");

const songTitle =
document.getElementById("songTitle");

const playBtn =
document.getElementById("playBtn");

const progress =
document.getElementById("progress");

const progressContainer =
document.getElementById("progressContainer");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

let isPlaying = false;

/* Select Song */

fileInput.addEventListener(
"change",
function(){

const file = this.files[0];

if(file){

    const url =
    URL.createObjectURL(file);

    audio.src = url;

    songTitle.textContent =
    file.name;

    audio.load();
}

});

/* Play Pause */

playBtn.addEventListener(
"click",
function(){

if(!audio.src) return;

if(isPlaying){

    audio.pause();

    playBtn.innerHTML =
    '<i class="fas fa-play"></i>';

}else{

    audio.play();

    playBtn.innerHTML =
    '<i class="fas fa-pause"></i>';

}

isPlaying = !isPlaying;

});

/* Progress */

audio.addEventListener(
"timeupdate",
function(){

const percent =
(audio.currentTime /
audio.duration) * 100;

progress.style.width =
percent + "%";

currentTime.textContent =
formatTime(audio.currentTime);

duration.textContent =
formatTime(audio.duration);

});

/* Seek */

progressContainer.addEventListener(
"click",
function(e){

const width =
this.clientWidth;

const clickX =
e.offsetX;

audio.currentTime =
(clickX / width) *
audio.duration;

});

/* Format Time */

function formatTime(time){

if(isNaN(time))
return "0:00";

let mins =
Math.floor(time / 60);

let secs =
Math.floor(time % 60);

if(secs < 10)
secs = "0" + secs;

return mins + ":" + secs;

}

/* Song End */

audio.addEventListener(
"ended",
function(){

isPlaying = false;

playBtn.innerHTML =
'<i class="fas fa-play"></i>';

});

</script>

</body>
</html>
