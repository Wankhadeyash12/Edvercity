<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navbar</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 8%;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:700;
}

.nav-links{
    display:flex;
    list-style:none;
}

.nav-links li{
    margin-left:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:17px;
    transition:.3s;
}

.nav-links a:hover{
    color:#ffb347;
}

/* Hamburger */
.hamburger{
    display:none;
    flex-direction:column;
    cursor:pointer;
}

.hamburger span{
    width:28px;
    height:3px;
    background:white;
    margin:4px;
    border-radius:5px;
    transition:0.3s;
}

/* Hero Section */
.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.hero-content{
    max-width:700px;
}

.hero-content h1{
    font-size:3.5rem;
    margin-bottom:20px;
    text-shadow:3px 3px 10px rgba(0,0,0,0.4);
}

.hero-content p{
    font-size:1.2rem;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    padding:14px 30px;
    background:#ffb347;
    color:#222;
    text-decoration:none;
    border-radius:30px;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-4px);
    background:white;
}

/* Mobile */
@media(max-width:768px){

    .hamburger{
        display:flex;
    }

    .nav-links{
        position:absolute;
        top:70px;
        right:0;
        width:100%;
        background:#222;
        flex-direction:column;
        align-items:center;
        display:none;
    }

    .nav-links.active{
        display:flex;
    }

    .nav-links li{
        margin:20px 0;
    }

    .hero-content h1{
        font-size:2.2rem;
    }

    .hero-content p{
        font-size:1rem;
    }
}
</style>
</head>
<body>

<nav class="navbar">

    <div class="logo">MyWebsite</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

</nav>

<section class="hero">
    <div class="hero-content">
        <h1>Responsive Navbar with Hamburger Menu</h1>
        <p>
            Resize the browser window to see the hamburger menu appear on mobile devices.
        </p>
        <a href="#" class="btn">Get Started</a>
    </div>
</section>

<script>
const hamburger = document.getElementById("hamburger");
const navLinks = document.getElementById("navLinks");

hamburger.addEventListener("click", () => {
    navLinks.classList.toggle("active");
});
</script>

</body>
</html>
