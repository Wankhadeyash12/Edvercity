<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Shadow & Text Shadow Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.card{
    width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;

    /* Box Shadow */
    box-shadow:0 10px 30px rgba(0,0,0,0.3);

    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

h1{
    color:#333;
    margin-bottom:15px;

    /* Text Shadow */
    text-shadow:3px 3px 5px rgba(0,0,0,0.3);
}

p{
    color:#666;
    margin-bottom:20px;
    line-height:1.6;
}

img{
    width:100%;
    border-radius:15px;
    margin-bottom:20px;

    /* Box Shadow on Image */
    box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;

    /* Box Shadow on Button */
    box-shadow:0 5px 15px rgba(79,172,254,0.5);

    transition:0.3s;
}

button:hover{
    background:#007bff;
    transform:scale(1.05);
}

@media(max-width:500px){
    .card{
        width:90%;
    }
}
</style>
</head>
<body>

<div class="card">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
         alt="Nature">

    <h1>Shadow Effects</h1>

    <p>
        This page demonstrates the use of
        <strong>box-shadow</strong> and
        <strong>text-shadow</strong> in CSS to create
        attractive and modern UI designs.
    </p>

    <button>Learn More</button>
</div>

</body>
</html>
