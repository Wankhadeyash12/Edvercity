<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Dropdown Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
    135deg,
    #0f172a,
    #1e3a8a,
    #7c3aed);
    overflow-x:hidden;
}

/* Navbar */

.navbar{
    width:90%;
    max-width:1200px;
    margin:25px auto;
    padding:15px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.2);

    border-radius:20px;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:white;
}

/* Menu */

.menu{
    display:flex;
    list-style:none;
    gap:25px;
}

.menu li{
    position:relative;
}

.menu li a{
    color:white;
    text-decoration:none;
    font-weight:500;
    padding:12px 18px;
    border-radius:12px;
    transition:.3s;
}

.menu li a:hover{
    background:rgba(255,255,255,.15);
}

/* Premium Dropdown */

.dropdown{
    position:absolute;
    top:65px;
    left:0;

    min-width:250px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:15px;

    list-style:none;

    opacity:0;
    visibility:hidden;

    transform:translateY(20px);

    transition:.4s;
}

.dropdown li{
    width:100%;
}

.dropdown li a{
    display:block;
    padding:15px 20px;
    color:white;
}

.dropdown li a:hover{
    background:rgba(255,255,255,.1);
    padding-left:30px;
}

/* Show Dropdown */

.menu li:hover .dropdown{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

/* Hero Section */

.hero{
    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:4rem;
    margin-bottom:15px;
    text-shadow:0 0 30px rgba(255,255,255,.3);
}

.hero p{
    font-size:1.2rem;
    opacity:.9;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;

    background:linear-gradient(
    45deg,
    #06b6d4,
    #8b5cf6);

    color:white;
    text-decoration:none;

    border-radius:50px;

    transition:.4s;
}

.btn:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 30px rgba(139,92,246,.5);
}

/* Mobile */

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:15px;
    }

    .menu{
        flex-direction:column;
        width:100%;
        text-align:center;
    }

    .dropdown{
        position:static;
        margin-top:10px;
        opacity:1;
        visibility:visible;
        transform:none;
        display:none;
    }

    .menu li:hover .dropdown{
        display:block;
    }

    .hero h1{
        font-size:2.5rem;
    }
}

</style>
</head>
<body>

<nav class="navbar">

    <div class="logo">
        NovaUI
    </div>

    <ul class="menu">

        <li><a href="#">Home</a></li>

        <li>

            <a href="#">Services ▼</a>

            <ul class="dropdown">

                <li><a href="#">💻 Web Development</a></li>

                <li><a href="#">📱 App Development</a></li>

                <li><a href="#">🎨 UI/UX Design</a></li>

                <li><a href="#">📈 Digital Marketing</a></li>

            </ul>

        </li>

        <li><a href="#">Portfolio</a></li>

        <li><a href="#">Contact</a></li>

    </ul>

</nav>

<section class="hero">

    <div>

        <h1>Premium CSS Dropdown Menu</h1>

        <p>
            Glassmorphism • Smooth Animation • Modern UI
        </p>

        <a href="#" class="btn">
            Explore More
        </a>

    </div>

</section>

</body>
</html>
