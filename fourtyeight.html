<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Step Registration Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#2563eb,#9333ea);
    overflow:hidden;
}

/* Background Glow */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
}

.glow1{
    width:300px;
    height:300px;
    background:#06b6d4;
    top:-100px;
    left:-100px;
}

.glow2{
    width:350px;
    height:350px;
    background:#ec4899;
    bottom:-100px;
    right:-100px;
}

/* Form Card */

.container{
    width:600px;
    max-height:90vh;
    overflow:auto;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:30px;

    padding:35px;

    color:white;

    box-shadow:0 20px 50px rgba(0,0,0,.3);

    z-index:10;
}

.container::-webkit-scrollbar{
    display:none;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

/* Progress */

.progress-container{
    height:8px;
    background:rgba(255,255,255,.2);
    border-radius:20px;
    margin-bottom:25px;
}

.progress{
    height:100%;
    width:25%;
    background:#00e5ff;
    border-radius:20px;
    transition:.4s;
}

/* Steps */

.step{
    display:none;
}

.step.active{
    display:block;
}

/* Inputs */

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
}

.input-group input,
.input-group select{

    width:100%;
    padding:14px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.12);

    color:white;
}

input::placeholder{
    color:#ddd;
}

select{
    color:white;
}

option{
    color:black;
}

/* Radio Buttons */

.radio-group{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.radio-group label{

    background:rgba(255,255,255,.12);

    padding:12px 18px;

    border-radius:12px;

    cursor:pointer;
}

.radio-group input{
    width:auto;
    margin-right:5px;
}

/* Buttons */

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

button{

    padding:12px 30px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-weight:600;
}

.prev{
    background:#64748b;
    color:white;
}

.next{

    background:linear-gradient(
    45deg,
    #06b6d4,
    #8b5cf6);

    color:white;
}

button:hover{
    transform:translateY(-3px);
}

.checkbox{
    margin-top:15px;
}

.checkbox input{
    width:auto;
    margin-right:8px;
}

@media(max-width:650px){

.container{
    width:95%;
    padding:25px;
}

}

</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">

<h2>Create Your Account</h2>

<div class="progress-container">
    <div class="progress"></div>
</div>

<!-- STEP 1 -->

<div class="step active">

<h3>Personal Information</h3>

<div class="input-group">
<input type="text" placeholder="Full Name">
</div>

<div class="input-group">
<input type="email" placeholder="Email Address">
</div>

<div class="input-group">
<input type="tel" placeholder="Mobile Number">
</div>

<div class="input-group">
<label>Date of Birth</label>
<input type="date">
</div>

</div>

<!-- STEP 2 -->

<div class="step">

<h3>Profile Details</h3>

<div class="input-group">
<label>You Are</label>

<div class="radio-group">

<label>
<input type="radio" name="role">
Student
</label>

<label>
<input type="radio" name="role">
Employee
</label>

</div>

</div>

<div class="input-group">

<label>Gender</label>

<div class="radio-group">

<label>
<input type="radio" name="gender">
Male
</label>

<label>
<input type="radio" name="gender">
Female
</label>

<label>
<input type="radio" name="gender">
Other
</label>

</div>

</div>

<div class="input-group">
<input type="text" placeholder="City">
</div>

<div class="input-group">
<input type="text" placeholder="State">
</div>

<div class="input-group">
<label>Country</label>

<select>
<option>India</option>
<option>USA</option>
<option>Canada</option>
<option>Australia</option>
</select>

</div>

</div>

<!-- STEP 3 -->

<div class="step">

<h3>Education / Work Details</h3>

<div class="input-group">
<input type="text" placeholder="College / Company Name">
</div>

<div class="input-group">
<input type="text" placeholder="Branch / Designation">
</div>

<div class="input-group">
<input type="text" placeholder="Semester / Experience">
</div>

<div class="input-group">
<label>Upload Profile Photo</label>
<input type="file">
</div>

</div>

<!-- STEP 4 -->

<div class="step">

<h3>Account Setup</h3>

<div class="input-group">
<input type="text" placeholder="Username">
</div>

<div class="input-group">
<input type="password" placeholder="Password">
</div>

<div class="input-group">
<input type="password" placeholder="Confirm Password">
</div>

<div class="checkbox">

<label>
<input type="checkbox">
I agree to the Terms & Conditions
</label>

</div>

</div>

<div class="buttons">

<button class="prev"
onclick="changeStep(-1)">
Previous
</button>

<button class="next"
onclick="changeStep(1)">
Next
</button>

</div>

</div>

<script>

let currentStep = 0;

const steps =
document.querySelectorAll(".step");

const progress =
document.querySelector(".progress");

function showStep(index){

steps.forEach(step =>
step.classList.remove("active"));

steps[index]
.classList.add("active");

progress.style.width =
((index+1)/4)*100 + "%";
}

function changeStep(direction){

currentStep += direction;

if(currentStep < 0)
currentStep = 0;

if(currentStep > 3)
currentStep = 3;

showStep(currentStep);

}

</script>

</body>
</html>
